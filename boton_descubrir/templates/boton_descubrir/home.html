{% load static %}  <!-- Carga el archivo CSS con el contenido visual-->

<!DOCTYPE html>
<html lang="es">

<head>  <!-- Datos no visibles en la página -->
    <meta charset="UTF-8"> <!-- Permite tildes y las ñ -->
    <title>Botón descubrir</title> <!-- Título que se ve en la pestaña -->
    <link rel="stylesheet" href="{% static 'boton_descubrir/css/estilos.css' %}"> <!-- Conecta el archivo con el CSS -->
</head>


<body class="pagina-home">  <!-- Todo lo que ve el usuario -->

    <div>  <!-- div = contenedor de elementos de la misma sección -->
        <h1>Descubre nuevos patrimonios</h1>  <!-- Titulo en pantalla (h = heading) -->

        <a href = "{% url 'generar_lista' %}?nuevo=1">  <!-- Crea un enlace con destino (href) con nombre "generar_lista" -->
            <button>Descubrir</button>  <!-- Crea un botón visual para el enlace -->
        </a>
        
        <a href = "{% url 'solicitud' %}"> 
            <button>Solicitar patrimonio</button>  
        </a>
        
    </div>

    <a href="/admin/" class="link-admin">  <!-- Cuenta administrativa -->
        Cuenta administrativa
    </a>

</body>

</html>
