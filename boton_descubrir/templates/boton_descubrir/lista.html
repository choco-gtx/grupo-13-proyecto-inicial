<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Lista de patrimonios</title>

    <style>
        body {
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        .contenedor {  /* Los contenedores con nombre propio deben tener un punto al inicio. */
            width: 100%;
            text-align: center;
        }
        h1 { 
            margin-bottom: 25px;
            font-size: 40px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            background: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 18px 20px;
            margin: 12px auto;
            width: 70%;
            text-align: left;
        }
        .botones {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 18px;
        }
        button {
            background-color: blue;
            color: white;
            font-size: 18px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            padding: 14px 28px;
            border: 2px solid black;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>

</head>


<body>

    <div class="contenedor">  <!-- La división se llama "contenedor"-->
        <h1>Lista aleatoria de patrimonios</h1>

        <ul> <!-- u1 = Unordered list = lista sin numeración -->
            {% for item in datos %}  <!-- "datos" viene de views.py -->

                <li> <!-- li = List item -->
                    <strong>Patrimonio:</strong> {{ item.patrimonio }} <br>  <!-- Strong: Destacado (negrita)-->
                    <strong>Ubicación:</strong> {{ item.ubicacion }} <br>  <!-- Br: Salto de línea (break)-->
                    <strong>Precio:</strong> {{ item.precio }} <br>
                    <strong>Filtro estudiante:</strong> {{ item.filtro_estudiante }}
                </li>

            {% empty %}  <!-- Si datos está vacío -->
                <li>No hay resultados.</li>

            {% endfor %} <!-- Terminar el bucle del for-->

        </ul>

        <div class="botones">  
            <a href="{% url 'generar_lista' %}">  <!-- Vuelve a cargar la página directamente, con nueva lista -->
                <button type="button">Reintentar</button>
            </a>

            <a href="{% url 'home' %}">
                <button type="button">Volver</button>
            </a>

        </div>

    </div>

</body>

</html>
